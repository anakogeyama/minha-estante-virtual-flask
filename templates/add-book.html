{% extends 'layout.html' %}

{% block title %}Minha estante virtual{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Adicionar livro</h2>
    <form id="addBookForm" action="{{ url_for('show_add_form') }}" method="POST">
        <div class="form-group">
            <label for="title">Título:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="author">Autor:</label>
            <input type="text" id="author" name="author">
        </div>

        <div class="form-group">
            <label for="genre">Genero:</label>
            <input type="text" id="genre" name="genre">
        </div>

        <div class="form-group">
            <label for="image_url">URL da capa:</label>
            <input type="url" id="image_url" name="image_url">
        </div>

        <div class="form-group">
            <label for="date">Data:</label>
            <input type="date" id="date" name="date">
        </div>



        <div class="form-group">
            <label for="stars">Avaliação:</label>
            <select type="select" id="stars" name="stars" required>
                <option value="">Selecione</option>
                <option value="1">★</option>
                <option value="2">★★</option>
                <option value="3">★★★</option>
                <option value="4">★★★★</option>
                <option value="5">★★★★★</option>
            </select>
        </div>

        <div class="form-group">
            <label for="review">Resenha:</label>
            <textarea id="review" name="review" required></textarea>
        </div>
        <button type="submit">Adicionar</button>
    </form>
</div>

{% endblock %}
