{% extends 'layout.html' %}

{% block title %}Minha estante virtual{% endblock %}

{% block content %}
<div class="search-container">
    <input type="text" id="search-input" placeholder="Seach for title...">
</div>
<div class="cards-container">
 
    {% for book in books %}
    <a href="{{ url_for('book_details', book_id=book.id) }}">
        <div class="card">
            <img src="{{ book.image_url }}" alt="Poster for {{ book.title }}" />

            <h3>{{ book.title }}</h3>

            <div class="rating">
                {% for i in range(book.stars | int) %}
                <span>★</span>
                {% endfor %}
            </div>
        </div>
    </a>
    {% endfor %}

</div>
{% endblock %}
