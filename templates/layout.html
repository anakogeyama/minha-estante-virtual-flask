<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Minha estante virtual{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}">
            <h1>📔</h1>
            <h1>Minha estante virtual</h1>
        </a>
        <div class="header-buttons">
            <button id="theme-toggle-button">🌙</button>
            <button id="addButton"><a href="{{ url_for('show_add_form') }}">+</a></button>
        </div>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 Minha estante virtual. Todos os direitos reservados.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
